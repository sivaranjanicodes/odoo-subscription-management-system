<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Brightloop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <h1>Brightloop</h1>
      <h2>Create your account</h2>
      <p>Register your business to manage subscriptions and invoices.</p>

      <form id="registerForm">
        <label for="registerName">Full name</label>
        <input
          id="registerName"
          name="name"
          type="text"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        />

        <label for="registerCompany">Company name</label>
        <input
          id="registerCompany"
          name="company"
          type="text"
          placeholder="Enter your company name"
          autocomplete="organization"
          required
        />

        <label for="registerEmail">Work email</label>
        <input
          id="registerEmail"
          name="email"
          type="email"
          placeholder="name@company.com"
          autocomplete="email"
          required
        />

        <label for="registerPhone">Phone number</label>
        <input
          id="registerPhone"
          name="phone"
          type="tel"
          placeholder="Enter your phone number"
          autocomplete="tel"
        />

        <label for="registerPassword">Password</label>
        <input
          id="registerPassword"
          name="password"
          type="password"
          placeholder="Create a password"
          autocomplete="new-password"
          minlength="9"
          required
        />
        <small>
          Use at least 9 characters, including uppercase, lowercase, and a
          special character.
        </small>

        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          placeholder="Enter the password again"
          autocomplete="new-password"
          required
        />

        <label class="terms-label">
          <input id="acceptTerms" type="checkbox" required />
          I agree to the terms and conditions.
        </label>

        <button type="submit">Create account</button>
        <p id="registerMessage" role="status"></p>
      </form>

      <p>Already have an account? <a href="login.html">Log in</a></p>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
