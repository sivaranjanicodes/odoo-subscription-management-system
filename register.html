<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Brightloop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="brand" href="index.html">Brightloop</a>
      <h1>Create your account</h1>
      <p>Register as a customer.</p>

      <form id="registerForm">
        <label for="fullName">Full name</label>
        <input
          id="fullName"
          name="fullName"
          type="text"
          autocomplete="name"
          required
        />

        <label for="companyName">Company name</label>
        <input
          id="companyName"
          name="companyName"
          type="text"
          autocomplete="organization"
          required
        />

        <label for="registerEmail">Work email</label>
        <input
          id="registerEmail"
          name="email"
          type="email"
          autocomplete="email"
          required
        />

        <label for="phone">Phone (optional)</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" />

        <label for="registerPassword">Password</label>
        <input
          id="registerPassword"
          name="password"
          type="password"
          autocomplete="new-password"
          required
        />
        <small
          >At least 9 characters, including uppercase, lowercase, and a special
          character.</small
        >

        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          required
        />

        <label class="checkbox-label">
          <input id="terms" name="terms" type="checkbox" required />
          I agree to the terms and conditions.
        </label>

        <p id="registerMessage" class="form-message" aria-live="polite"></p>
        <button class="full-button" type="submit">Create account</button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
